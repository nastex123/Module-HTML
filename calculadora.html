<section class="section calculadora-section">
    <div class="calculadora-container">
        <div class="calculadora-pantalla">
    <div class="calculadora-fila-unica">
        <input type="text" id="num1" class="calc-input" placeholder="N1">
        <span class="calc-simbolo"></span> 
        <input type="text" id="operador" class="calc-input operador-input" placeholder="Op" maxlength="1">
        <input type="text" id="num2" class="calc-input" placeholder="N2">
        <span class="calc-simbolo">=</span>
        <input type="text" id="pantalla" class="calc-input resultado-input" readonly placeholder="Res">
    </div>
</div>
        <div class="calculadora-botones">
            <button class="calc-btn" data-valor="7">7</button>
            <button class="calc-btn" data-valor="8">8</button>
            <button class="calc-btn" data-valor="9">9</button>
            <button class="calc-btn operador" data-valor="/">/</button>
            
            <button class="calc-btn" data-valor="4">4</button>
            <button class="calc-btn" data-valor="5">5</button>
            <button class="calc-btn" data-valor="6">6</button>
            <button class="calc-btn operador" data-valor="*">*</button>
            
            <button class="calc-btn" data-valor="1">1</button>
            <button class="calc-btn" data-valor="2">2</button>
            <button class="calc-btn" data-valor="3">3</button>
            <button class="calc-btn operador" data-valor="-">-</button>
            
            <button class="calc-btn" data-valor="0">0</button>
            <button class="calc-btn" data-valor=".">.</button>
            <button class="calc-btn limpiarTodo" data-valor="AC">AC</button>
            <button class="calc-btn operador" data-valor="+">+</button>
            
            <button class="calc-btn igual" data-valor="=">=</button>
        </div>
    </div>
</section>
