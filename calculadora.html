<main class="calculadora-main">
    <div class="calculadora-container semitransparente">
        <div class="calculadora-pantalla">
            <input type="text" id="pantalla" placeholder="0" readonly>
        </div>

        <div class="calculadora-botones">
            <button class="calc-btn limpiar" onclick="limpiar()">C</button>
            <button class="calc-btn operador" onclick="agregar('/')">/</button>
            <button class="calc-btn operador" onclick="agregar('*')">×</button>
            <button class="calc-btn operador" onclick="borrar()">←</button>

            <button class="calc-btn" onclick="agregar('7')">7</button>
            <button class="calc-btn" onclick="agregar('8')">8</button>
            <button class="calc-btn" onclick="agregar('9')">9</button>
            <button class="calc-btn operador" onclick="agregar('-')">-</button>

            <button class="calc-btn" onclick="agregar('4')">4</button>
            <button class="calc-btn" onclick="agregar('5')">5</button>
            <button class="calc-btn" onclick="agregar('6')">6</button>
            <button class="calc-btn operador" onclick="agregar('+')">+</button>

            <button class="calc-btn" onclick="agregar('1')">1</button>
            <button class="calc-btn" onclick="agregar('2')">2</button>
            <button class="calc-btn" onclick="agregar('3')">3</button>
            <button class="calc-btn" onclick="agregar('.')">.</button>

            <button class="calc-btn btn-cero" onclick="agregar('0')">0</button>
            <button class="calc-btn igual" onclick="calcular()">=</button>
        </div>
    </div>
</main>
